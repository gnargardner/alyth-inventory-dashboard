<script>
const PUB={on:false,items:[],shop:null,drafts:{},mdrafts:{},snap:null,hist:[],sheet:null,prods:[],busy:false,msg:'',skip:{}};
const PUBLBL={'-2':'Runs small','-1':'A bit snug','0':'True to size','1':'A bit relaxed','2':'Runs big'};
const PUBLONG={XS:'X-Small',S:'Small',M:'Medium',L:'Large',XL:'X-Large',XXL:'XX-Large'};
async function pubGql(query,variables){const r=await fetch('shopify:admin/api/graphql.json',{method:'POST',body:JSON.stringify({query,variables})});const j=await r.json();if(j.errors)throw new Error(typeof j.errors==='string'?j.errors:(j.errors[0]&&j.errors[0].message)||'Shopify error');return j.data;}
function pubSheet(){return new Promise((ok,no)=>{const cb='__pubS'+Date.now(),s=document.createElement('script'),t=setTimeout(()=>{no(new Error('sheet timeout'))},12000);window[cb]=j=>{clearTimeout(t);delete window[cb];s.remove();const out={};(j.table.rows||[]).forEach(r=>{const v=(r.c||[]).map(c=>c?String(c.f!=null?c.f:(c.v==null?'':c.v)).trim():'');if(v[0])out[v[0]]={height:v[2]||'',bust:v[3]||'',waist:v[4]||'',bottoms:v[5]||'',tops:v[6]||'',bras:v[7]||''}});ok(out)};s.onerror=()=>{clearTimeout(t);no(new Error('sheet not reachable'))};s.src='https://docs.google.com/spreadsheets/d/'+D.pub.sheet+'/gviz/tq?tqx=responseHandler:'+cb+'&t='+Date.now();document.head.appendChild(s)})}
function pubName(l){const n=l.split(/ - | \(| is /)[0].trim();return D.pub.alias[n]||n}
function pubKind(t){t=t.toLowerCase();if(/\bbra\b/.test(t))return'bras';if(/legging|short|pant|jogger|skirt|skort/.test(t))return'bottoms';return'tops'}
const PUBW=/(Wearing\s+)(XX-Large|X-Large|X-Small|Small|Medium|Large)\b/;
const PUBSHORT={'X-Small':'XS','Small':'S','Medium':'M','Large':'L','X-Large':'XL','XX-Large':'XXL'};
function pubKey(l){return l.split(' - ')[0].trim()}
function pubLines(notes){return (notes||'').split('\n').map(l=>({l,m:l.match(PUBW)})).filter(x=>x.m).map(x=>({k:pubKey(x.l),name:pubName(x.l),size:x.m[2]}))}
function pubRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function pubBuild(){const items=[],F=['height','bust','waist','bottoms','tops','bras'],ch=[];if(PUB.sheet&&PUB.snap){Object.keys(PUB.sheet).forEach(n=>{const o=PUB.snap[n];if(!o)return;F.forEach(f=>{const a=(o[f]||'').trim(),b=(PUB.sheet[n][f]||'').trim();if(a&&b&&a!==b)ch.push({model:n,field:f,old:a,neu:b})})})}
 PUB.prods.forEach(p=>{const h=p.handle,cur=p.fit,d=PUB.drafts[h],base=D.pub.fit[h],want=d!=null?d:(cur==null?base:null);
  if(want!=null&&String(want)!==(cur==null?'':String(cur)))items.push({id:'fit|'+h,kind:d==null?'setup':'fit',title:p.title,detail:'Fit: '+(cur!=null?PUBLBL[cur]+' to ':'')+PUBLBL[want],owner:p.id,writes:[{namespace:'custom',key:'fit_pick',type:'number_integer',value:String(want)}],draft:d!=null?h:null});
  if(p.photos==null&&D.pub.photos[h])items.push({id:'photos|'+h,kind:'setup',title:p.title,detail:'Photo names',owner:p.id,writes:[{namespace:'custom',key:'photo_models',type:'json',value:D.pub.photos[h]}]});
  let photo=null;try{photo=p.photos?JSON.parse(p.photos):null}catch(e){}
  const fresh=[];if(photo&&D.pub.photos[h]){try{const b=JSON.parse(D.pub.photos[h]);Object.keys(b).forEach(k=>{if(!(k in photo)){photo[k]=b[k];fresh.push(b[k].n+' wears '+b[k].s)}})}catch(e){}}
  const lines=(p.notes||'').split('\n'),kind=pubKind(p.title),det=[];if(p.notes)
  ch.forEach(c=>{let hit=false;lines.forEach((l,i)=>{if(pubName(l)!==c.model)return;let nw=l;if(c.field==='height')nw=l.replace(new RegExp("(^|[^\\d'])"+pubRe(c.old)+'(?!\\d)'),(m,a)=>a+c.neu);else if(c.field==='bust')nw=l.replace(new RegExp('((?:Bust|Chest)\\s*)'+pubRe(c.old)+'\\b'),(m,a)=>a+c.neu);else if(c.field==='waist')nw=l.replace(new RegExp('(Waist\\s*)'+pubRe(c.old)+'(?![\\d.])'),(m,a)=>a+c.neu);else if(c.field===kind&&PUBLONG[c.old]&&PUBLONG[c.neu])nw=l.replace(new RegExp('(Wearing\\s+)'+pubRe(PUBLONG[c.old])+'\\b'),(m,a)=>a+PUBLONG[c.neu]);if(nw!==l){lines[i]=nw;hit=true}});
   if(hit){det.push(c.model+' '+c.field+': '+c.old+' to '+c.neu);if(photo)Object.values(photo).forEach(e=>{if(e.n!==c.model&&e.n!==c.model.split(' ')[0])return;if(['bottoms','tops','bras'].includes(c.field)){if(e.s===c.old)e.s=c.neu}else Object.keys(e).forEach(k=>{if(k!=='n'&&typeof e[k]==='string'&&e[k].includes(c.old))e[k]=e[k].replace(c.old,c.neu)})})}});
  const md=PUB.mdrafts[h]||{};let msz=false;Object.keys(md).forEach(k=>lines.forEach((l,i)=>{if(pubKey(l)!==k)return;const m=l.match(PUBW);if(!m||m[2]===md[k])return;lines[i]=l.replace(PUBW,(x,a)=>a+md[k]);msz=true;det.push(pubName(l)+' wears '+md[k]+' on this product (was '+m[2]+')');if(photo){const n=pubName(l),a=PUBSHORT[m[2]],b=PUBSHORT[md[k]];Object.values(photo).forEach(e=>{if((e.n===n||e.n===n.split(' ')[0])&&e.s===a)e.s=b})}}));
  if(det.length){const w=[{namespace:'custom',key:'shipping',type:'multi_line_text_field',value:lines.join('\n')}];if(photo)w.push({namespace:'custom',key:'photo_models',type:'json',value:JSON.stringify(photo)});items.push({id:'model|'+h,kind:'model',msize:msz?h:null,title:p.title,detail:det.concat(fresh.length?['New photo names: '+fresh.join(', ')]:[]).join('; '),owner:p.id,writes:w})}
  else if(fresh.length)items.push({id:'photos+|'+h,kind:'photos',title:p.title,detail:'New photo names: '+fresh.join(', '),owner:p.id,writes:[{namespace:'custom',key:'photo_models',type:'json',value:JSON.stringify(photo)}]});});
 PUB.items=items;}
async function pubScan(){if(typeof D==='undefined'||!D||!D.pub||PUB.busy)return;try{let c=null,out=[];const Q=`query($c:String){currentAppInstallation{id a:metafield(namespace:"alyth",key:"fit_drafts"){value} e:metafield(namespace:"alyth",key:"model_drafts"){value} b:metafield(namespace:"alyth",key:"sheet_snapshot"){value} d:metafield(namespace:"alyth",key:"publish_history"){value}} products(first:100,after:$c,query:"status:active"){pageInfo{hasNextPage endCursor}nodes{id handle title a:metafield(namespace:"custom",key:"shipping"){value} b:metafield(namespace:"custom",key:"fit_pick"){value} c:metafield(namespace:"custom",key:"photo_models"){value}}}}`;let sh=null;while(true){const d=await pubGql(Q,{c});sh=d.currentAppInstallation;out=out.concat(d.products.nodes);if(!d.products.pageInfo.hasNextPage)break;c=d.products.pageInfo.endCursor}
  PUB.shop=sh.id;PUB.drafts=sh.a?JSON.parse(sh.a.value):{};PUB.mdrafts=sh.e?JSON.parse(sh.e.value):{};PUB.snap=sh.b?JSON.parse(sh.b.value):null;PUB.hist=sh.d?JSON.parse(sh.d.value):[];PUB.prods=out.map(p=>({id:p.id,handle:p.handle,title:p.title,notes:p.a?p.a.value:'',fit:p.b?p.b.value:null,photos:p.c?p.c.value:null}));PUB.on=true;pubGuard();
  try{PUB.sheet=await pubSheet();if(!PUB.snap){PUB.snap=PUB.sheet;await pubShopSet('sheet_snapshot',PUB.sheet)}}catch(e){PUB.sheet=null;PUB.msg='Could not read the model sheet just now.'}
  pubBuild();if(typeof rvPaint==='function')rvPaint();if(MODE==='ft')pubFit();}catch(e){PUB.on=false;}}
async function pubGuard(){try{const g=await shopify.scopes.query();if((g.granted||[]).includes('write_products')&&!PUB.busy)await pubLock()}catch(e){}}
async function pubAllow(){pubSay('Shopify is asking you to allow saving...');const r=await shopify.scopes.request(['write_products']);return !!(r&&r.result==='granted-all');}
async function pubLock(){for(let i=0;i<3;i++){try{await shopify.scopes.revoke(['write_products']);return true}catch(e){await new Promise(r=>setTimeout(r,800))}}return false;}
async function pubShopSet(key,val){const d=await pubGql(`mutation($m:[MetafieldsSetInput!]!){metafieldsSet(metafields:$m){userErrors{field message}}}`,{m:[{ownerId:PUB.shop,namespace:'alyth',key,type:'json',value:JSON.stringify(val)}]});const e=d.metafieldsSet.userErrors;if(e.length)throw new Error(e[0].message);}
function pubCount(){return PUB.on?PUB.items.filter(i=>!PUB.skip[i.id]).length:0}
function pubPanel(){if(!PUB.on)return '';const I=PUB.items,S=I.filter(i=>i.kind==='setup'),O=I.filter(i=>i.kind!=='setup');let h='<div class="fbt" style="margin-top:14px">Site edits</div>';
 if(!I.length)h+='<p class="fbs">Everything matches the site.</p>';
 if(S.length){const on=!S.some(i=>PUB.skip[i.id]);h+=`<label class="fbitem" style="display:block"><input type="checkbox" ${on?'checked':''} onchange="pubTick('setup',this.checked)"> <b>First-time setup</b><div class="fbs">${S.length} items. Copies fit tags and photo names into product data. Nothing shoppers see changes.</div></label><details style="margin:-4px 0 8px 2px"><summary class="fbs" style="cursor:pointer">See all ${S.length}</summary>${S.map(i=>`<div class="fbs" style="margin-top:4px"><b>${fbEsc(i.title)}</b>: ${fbEsc(i.detail)}</div>`).join('')}</details>`}
 O.forEach(i=>{h+=`<label class="fbitem" style="display:block"><input type="checkbox" ${PUB.skip[i.id]?'':'checked'} onchange="pubTick('${i.id.replace(/'/g,"\\'")}',this.checked)"> <b>${fbEsc(i.title)}</b><div class="fbs">${fbEsc(i.detail)}</div></label>`});
 if(I.length)h+=`<p class="fbs" style="margin:10px 0 8px">Only the items ticked above change. Tap Publish, then Allow on Shopify's popup. The old values are backed up first, and saving turns off again right after.</p><button class="fbsend" id="pubgo" onclick="pubPublish()" ${PUB.busy?'disabled':''}>Publish to site</button>`;
 if(PUB.hist.length)h+=`<button class="fbi" style="margin-left:8px" onclick="pubUndo()" ${PUB.busy?'disabled':''}>Undo last publish</button>`;
 h+=`<div id="pubmsg" class="fbs" style="margin-top:8px">${fbEsc(PUB.msg)}</div>`;return h;}
function pubTick(id,on){const set=(k,v)=>{if(v)delete PUB.skip[k];else PUB.skip[k]=1};if(id==='setup')PUB.items.filter(i=>i.kind==='setup').forEach(i=>set(i.id,on));else set(id,on);rvPaint();}
function pubSay(t){PUB.msg=t;const m=document.getElementById('pubmsg');if(m)m.textContent=t;}
function pubAgain(){if(document.getElementById('rvpop'))rvBody();}
async function pubBackup(chosen){const ids=[...new Set(chosen.map(i=>i.owner))],cur={};for(let i=0;i<ids.length;i+=100){const d=await pubGql(`query($i:[ID!]!){nodes(ids:$i){...on Product{id a:metafield(namespace:"custom",key:"shipping"){value type} b:metafield(namespace:"custom",key:"fit_pick"){value type} c:metafield(namespace:"custom",key:"photo_models"){value type}}}}`,{i:ids.slice(i,i+100)});d.nodes.forEach(n=>{cur[n.id]={shipping:n.a,fit_pick:n.b,photo_models:n.c}})}
 const entries=[];chosen.forEach(i=>i.writes.forEach(w=>{const o=cur[i.owner][w.key];entries.push({owner:i.owner,title:i.title,namespace:w.namespace,key:w.key,type:w.type,old:o?o.value:null})}));
 const rec={at:new Date().toISOString(),who:fbWho(),snap:PUB.snap,drafts:PUB.drafts,mdrafts:PUB.mdrafts,entries};const h=[rec].concat(PUB.hist).slice(0,10);await pubShopSet('publish_history',h);PUB.hist=h;}
async function pubWrite(all){for(let i=0;i<all.length;i+=25){const d=await pubGql(`mutation($m:[MetafieldsSetInput!]!){metafieldsSet(metafields:$m){userErrors{field message}}}`,{m:all.slice(i,i+25)});const e=d.metafieldsSet.userErrors;if(e.length)throw new Error(e[0].message)}}
async function pubGate(){PUB.busy=true;pubAgain();let ok=false;try{ok=await pubAllow()}catch(e){PUB.busy=false;pubSay('Shopify could not ask for permission ('+e.message+'). Nothing was changed.');pubAgain();return false}if(!ok){PUB.busy=false;pubSay('Not allowed, so nothing was changed.');pubAgain();return false}return true;}
async function pubDone(){const off=await pubLock();if(!off)pubSay(PUB.msg+' Saving could not be turned off just now. It will be turned off next time the app opens.');PUB.busy=false;await pubScan();pubAgain();}
async function pubPublish(){if(PUB.busy)return;const chosen=PUB.items.filter(i=>!PUB.skip[i.id]);if(!chosen.length)return;if(!await pubGate())return;try{pubSay('Saving a backup first...');await pubBackup(chosen);pubSay('Publishing...');const all=[];chosen.forEach(i=>i.writes.forEach(w=>all.push({ownerId:i.owner,namespace:w.namespace,key:w.key,type:w.type,value:w.value})));await pubWrite(all);
  const dr={...PUB.drafts};chosen.forEach(i=>{if(i.draft)delete dr[i.draft]});await pubShopSet('fit_drafts',dr);const mdr={...PUB.mdrafts};chosen.forEach(i=>{if(i.msize)delete mdr[i.msize]});await pubShopSet('model_drafts',mdr);if(PUB.sheet&&!PUB.items.some(i=>i.kind==='model'&&PUB.skip[i.id]))await pubShopSet('sheet_snapshot',PUB.sheet);PUB.skip={};pubSay('Published '+chosen.length+' edits. A backup was saved first, so Undo can put them back.');}catch(e){pubSay('Stopped: '+e.message+'. Your old values are saved. Tap Undo if part of it went through.');}await pubDone();}
async function pubUndo(){if(PUB.busy||!PUB.hist.length)return;if(!await pubGate())return;const r=PUB.hist[0];try{pubSay('Putting the last publish back...');const set=r.entries.filter(e=>e.old!=null).map(e=>({ownerId:e.owner,namespace:e.namespace,key:e.key,type:e.type,value:e.old})),del=r.entries.filter(e=>e.old==null).map(e=>({ownerId:e.owner,namespace:e.namespace,key:e.key}));await pubWrite(set);for(let i=0;i<del.length;i+=25){const d=await pubGql(`mutation($m:[MetafieldIdentifierInput!]!){metafieldsDelete(metafields:$m){userErrors{field message}}}`,{m:del.slice(i,i+25)});const e=d.metafieldsDelete.userErrors;if(e.length)throw new Error(e[0].message)}
  if(r.snap)await pubShopSet('sheet_snapshot',r.snap);await pubShopSet('fit_drafts',r.drafts||{});await pubShopSet('model_drafts',r.mdrafts||{});const h=PUB.hist.slice(1);await pubShopSet('publish_history',h);pubSay('Undone. The site is back to how it was before that publish.');}catch(e){pubSay('Undo stopped: '+e.message);}await pubDone();}
function pubFit(){const P=$('#panel');$('#cards').innerHTML='';const q=(PUB.q||'').toLowerCase();const live={};PUB.prods.forEach(p=>live[p.handle]=p);
 let h='<h2>Fit and model sizes</h2>';if(!PUB.on){P.innerHTML=h+'<p class="fbs">Open this inside Shopify admin to edit fit tags.</p>';return}
 h+=`<p class="fbs">Tap a fit, or change the size a model wears on just that product. The model sheet stays the default everywhere else. Changes wait in Review and publish until you publish them.</p><input id="pubq" placeholder="Find a product or model" value="${fbEsc(PUB.q||'')}" oninput="PUB.q=this.value;pubFit()" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;width:240px;max-width:100%">`;

<script>
const $=s=>document.querySelector(s);
const TIP={

const PAL={goods:'#6b7280',freight:'#9aa0a6',card_fee:'#b8bdc3',processing:'#c9ccd0',delivery_software:'#d6d9dc',oh:'#eb6834',rent:'#eda100',wages:'#2a78d6',taxes:'#8e6dd6',owner:'#e87ba4',interest:'#e34948',principal:'#4a3aa7',cash:'#067647',profit:'#1baf7a',short:'#b42318',sweep:'#e34948'};
function river(title, src, items, opts={}){
 // src={label,val}; items=[{key,label,val,color}] ; leftover flows to opts.leftover={label,val,color}; optional second stage opts.stage2=[{label,val,color}] fed by leftover
 const W=opts.W||980,H=opts.H||Math.max(360,items.length*34+120),nodeW=14,gap=6,padT=26,padB=14;
 const total=Math.max(1,src.val);const posItems=items.filter(i=>i.val>0);const lo=opts.leftover;const sumOut=posItems.reduce((a,i)=>a+i.val,0)+Math.max(0,lo?lo.val:0);
 const scale=(H-padT-padB-gap*(posItems.length+1))/Math.max(sumOut,total);
 const xS=150,xT=W-370,xT2=W-150;
 let g='';
 // source node (net sales) + possible shortfall feeding it when costs exceed sales
 const srcH=total*scale;const shortV=lo&&lo.val<0?-lo.val:0;const srcY=padT+((H-padT-padB)-srcH-shortV*scale)/2;

 let yS=srcY;
 if(shortV>0){const sh=shortV*scale;const y0=srcY+srcH;g+=`<rect x="${xS}" y="${y0}" width="${nodeW}" height="${sh}" rx="3" fill="${PAL.short}"/><text x="${xS-10}" y="${y0+sh/2+4}" text-anchor="end" font-weight="700" fill="${PAL.short}">${lo.label}</text><text x="${xS-10}" y="${y0+sh/2+18}" text-anchor="end" fill="${PAL.short}">${fmt$(shortV)}</text>`;}
 // targets stacked
 const tgt=[...posItems];if(lo&&lo.val>0)tgt.push({key:'left',label:lo.label,val:lo.val,color:lo.color,isLeft:true});
 let yT=padT;const bands=[];const tiny=[];let labels='';let lastLabelY=-99;
 for(const t of tgt){const h=t.val*scale;
  g+=`<rect x="${xT}" y="${yT}" width="${nodeW}" height="${Math.max(2,h)}" rx="3" fill="${t.color}"/>`;
  const pct=t.val/total*100;const pctTxt=pct>=1?Math.round(pct)+'¢':pct.toFixed(1)+'¢';
  let ly=yT+h/2+4;if(ly<lastLabelY+16)ly=lastLabelY+16;lastLabelY=ly;
  if(Math.abs(ly-(yT+h/2+4))>2)labels+=`<line x1="${xT+nodeW}" x2="${xT+nodeW+8}" y1="${yT+h/2}" y2="${ly-4}" stroke="#999"/>`;
  labels+=`<text x="${xT+nodeW+10}" y="${ly}" font-weight="${t.isLeft?700:600}" fill="${t.isLeft?t.color:'#1a1a1a'}">${t.label} <tspan fill="#555" font-weight="400">${fmt$(t.val)} · ${pctTxt} of each $</tspan></text>`;
  // band from source
  const y0=yS,y1=yS+h;const mx=(xS+nodeW+xT)/2;
  g+=`<path d="M${xS+nodeW},${y0} C${mx},${y0} ${mx},${yT} ${xT},${yT} L${xT},${yT+h} C${mx},${yT+h} ${mx},${y1} ${xS+nodeW},${y1} Z" fill="${t.color}" opacity="${t.isLeft?0.55:0.35}"><title>${t.label}: ${fmt$(t.val)} (${pct}% of ${src.label.toLowerCase()})</title></path>`;
  bands.push({t,y:yT,h});yS=y1;yT+=h+gap;}
 // stage 2: leftover splits again (e.g. true profit -> principal + cash)
 if(opts.stage2&&lo&&lo.val>0){const L=bands.find(b=>b.t.isLeft);if(L){let y2=L.y;const sum2=opts.stage2.reduce((a,i)=>a+Math.max(0,i.val),0)||1;const sc2=L.h/sum2;const xA=xT+nodeW,xB=xT2;const mx=(xA+xB)/2;let yB=L.y;
  for(const t of opts.stage2){if(t.val<=0)continue;const h=t.val*sc2;g+=`<rect x="${xB}" y="${yB}" width="${nodeW}" height="${Math.max(2,h)}" rx="3" fill="${t.color}"/><text x="${xB+nodeW+8}" y="${yB+h/2+4}" font-weight="700" fill="${t.color}">${t.label}</text><text x="${xB+nodeW+8}" y="${yB+h/2+18}" fill="#555">${fmt$(t.val)}</text>`;
   g+=`<path d="M${xA},${y2} C${mx},${y2} ${mx},${yB} ${xB},${yB} L${xB},${yB+h} C${mx},${yB+h} ${mx},${y2+h} ${xA},${y2+h} Z" fill="${t.color}" opacity=".45"><title>${t.label}: ${fmt$(t.val)}</title></path>`;y2+=h;yB+=h+gap;}}}

function waterfall(title, steps, opts={}){
 // steps=[{label,val,type:'start'|'down'|'sub'|'total'|'end',color}] ; running total drawn as floating bars
 const W=opts.W||980,H=260,padL=60,padR=14,padT=24,padB=56;let run=0;const bars=[];let maxV=0,minV=0;
 for(const s of steps){if(s.type==='start'||s.type==='total'||s.type==='end'){run=s.type==='start'?s.val:(s.type==='end'?s.val:run);bars.push({...s,y0:0,y1:run});}else{const y0=run;run=run-s.val;bars.push({...s,y0:run,y1:y0});}maxV=Math.max(maxV,bars[bars.length-1].y0,bars[bars.length-1].y1);minV=Math.min(minV,bars[bars.length-1].y0,bars[bars.length-1].y1);}
 maxV*=1.08;const y=v=>padT+(H-padT-padB)*(1-(v-minV)/(maxV-minV||1));const n=bars.length;const gw=(W-padL-padR)/n;const bw=gw*0.62;

  if(i<n-1){const nx=padL+gw*(i+1)+(gw-bw)/2;g+=`<line x1="${x+bw}" x2="${nx}" y1="${y(b.type==='down'||b.type==='sub'?b.y0:b.y1)}" y2="${y(b.type==='down'||b.type==='sub'?b.y0:b.y1)}" stroke="#bbb" stroke-dasharray="3 3"/>`;}
  g+=`<text x="${x+bw/2}" y="${top-6}" text-anchor="middle" font-weight="600" font-size="11.5" fill="${isTot&&b.y1<0?PAL.short:'#1a1a1a'}">${isTot?(b.y1<0?'−':'')+fmt$(Math.abs(b.y1)):'−'+fmt$(b.val)}</text>`;
  const words=b.label.split(' ');const l1=words.slice(0,2).join(' '),l2=words.slice(2).join(' ');g+=`<text x="${x+bw/2}" y="${H-padB+16}" text-anchor="middle" font-size="11.5">${l1}</text>${l2?`<text x="${x+bw/2}" y="${H-padB+30}" text-anchor="middle" font-size="11.5">${l2}</text>`:''}`;});

function per100(title, rowsByChannel, items){
 // rowsByChannel: [{label,color,net,parts:{key:val}}] -> horizontal 100% bars
 let h=`<div style="font-size:13px;font-weight:600;margin:14px 0 6px">${title}</div><div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}<span><i style="background:${PAL.cash}"></i>left as cash</span><span><i style="background:${PAL.short}"></i>shortfall</span></div>`;

function flow(left,right,links,opts={}){const W=opts.W||760,rowH=56,H=Math.max(left.length,right.length)*rowH+40,nw=230,xL=0,xR=W-nw;const yL=i=>10+i*rowH,yR=i=>10+i*rowH;const maxA=Math.max(1,...links.map(l=>l.amount||1));
 const node=(n,x,y,src)=>`<g><rect class="node ${src?'src':''}" x="${x}" y="${y}" width="${nw}" height="44"/><text class="lbl" x="${x+12}" y="${y+18}">${n.title}</text><text class="sub" x="${x+12}" y="${y+34}">${n.sub||''}</text>${n.right?`<text class="amt" x="${x+nw-12}" y="${y+18}" text-anchor="end">${n.right}</text>`:''}</g>`;

 const placed=[];

  paths+=`<path class="link" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" style="stroke:${col}" stroke-width="${sw}" ${dash}><title>${l.tip||l.label||''}</title></path>`;
  const t=[0.5,0.32,0.68,0.42,0.58][li%5];const bx=(1-t)**3*x1+3*(1-t)**2*t*mx+3*(1-t)*t*t*mx+t**3*x2;const by=(1-t)**3*y1+3*(1-t)**2*t*y1+3*(1-t)*t*t*y2+t**3*y2;
  const txt=(l.style==='no'?'✕ ':'→ ')+l.label;const pw=Math.max(70,txt.length*6.6+18);let byy=by;

  labels+=`<g><title>${l.tip||''}</title><rect x="${bx-pw/2}" y="${byy-11}" width="${pw}" height="22" rx="11" fill="#fff" style="stroke:${col}" stroke-width="1.5"/><text x="${bx}" y="${byy+4}" text-anchor="middle" class="amt" style="fill:${l.style==='no'?'#e34948':'#1a1a1a'}">${txt}</text></g>`;});
 const Hh=Math.max(H,...placed.map(p=>p.y+24));
 return `<svg class="flow" viewBox="0 0 ${W} ${Hh}">${paths}${labels}</svg>`;}

 const PP=(P.per_product||[]).filter(r=>r.likely+r.look>0);h+=`<details class="explore"${PP.length&&PP.length<=12?' open':''}><summary>Products with photos still to confirm (${PP.length})</summary><div class="wrap"><table style="font-size:12.5px"><tr><th class="tl">product</th><th>photos</th><th>confirmed</th><th>likely (tap to confirm)</th><th>need a look</th></tr>${PP.map(r=>`<tr><td class="tl">${r.title}</td><td>${r.n}</td><td style="color:var(--grn)">${r.confirmed}</td><td style="color:var(--amb)">${r.likely}</td><td style="color:var(--red)">${r.look}</td></tr>`).join('')}</table></div></details>`;
 $('#panel').innerHTML=h;swGrid();}

function renderOutfits(){const P=D.of||{};const T=P.totals||{};const A=P.per_act||{};
 const HERO=[{cls:(T.checked||0)>=(T.photos||1)?'grn':'amb',l:'Outfit photos checked',v:(T.checked||0)+' / '+(T.photos||0),s:'activities done on '+(T.acts||0)+'; both steps needed'},{cls:(T.use||0)?'grn':'',l:'Marked "Use it"',v:T.use||0,s:'only these can show on the site'},{cls:(T.some||0)?'grn':'red',l:'Products with real looks',v:(T.some||0)+' / '+(T.products||0),s:(T.ready||0)+' with a full section (4 looks)'},{cls:'',l:'Photos added by hand',v:T.added||0,s:'stylized or customer photos'}];
 $('#cards').innerHTML=`<div class="hero" style="padding:0;grid-column:1/-1">`+HERO.map(c=>`<div class="card ${c.cls}" style="cursor:default"><div class="l">${c.l}</div><div class="v">${c.v}</div><div class="s">${c.s}</div></div>`).join('')+'</div>';
 let h=`<h2>Outfits <small style="font-weight:400;color:var(--mut)">updated ${P.generated||''}${P.snapshot_at?' · tags as of '+P.snapshot_at:' · no tags pulled yet'}</small></h2>`;
 if(P.error)h+=`<div class="warn">Could not read the outfit files: ${P.error}</div>`;
 h+=`<p class="d" style="display:block;margin:0 0 10px">Every outfit photo, tagged with the Alyth pieces in it, the activities it fits and whether it is good enough for the site. This feeds the "ways to wear it" section on each product page: the section shows one look per activity (Train, Run, Studio, Courts, Trail, Lounge), up to four, and only looks with two or more Alyth pieces and no clothes we don't sell. A product with no such looks yet shows suggestions that follow the pairing rules (a dress only gets a jacket). Tagging happens on the Outfit Tags page; this tab reports on it.</p>`;
 h+=`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 14px"><a class="btn" href="${P.tagger_url}" target="_blank" rel="noopener">Open the Outfit Tags page ↗</a></div>`;
 const AK=Object.entries(A).sort((a,b)=>b[1]-a[1]);h+=`<div class="panel" style="margin:0 0 14px;padding:14px 16px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">Looks per activity (checked, "Use it")</div><div style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px">${AK.length?AK.map(([k,v])=>`<span style="background:#f3f2ef;border-radius:999px;padding:4px 10px">${k} <b>${v}</b></span>`).join(''):'<span style="color:var(--mut)">None checked yet.</span>'}</div></div>`;
 const R=P.products||[];const lab={ready:['Full (4)','var(--grn)'],close:['Partial','var(--amb)'],need:['Suggestions only','var(--red)']};
 h+=`<div class="panel" style="margin:0 0 14px;padding:14px 16px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">Products, fewest looks first</div><div class="wrap"><table style="font-size:12.5px"><tr><th class="tl">product</th><th class="tl">type</th><th>checked looks</th><th>photos it may be in</th><th class="tl">activities covered</th><th class="tl">status</th></tr>${R.map(r=>`<tr><td class="tl">${r.title} <small style="color:var(--mut)">${r.gender==='men'?'M':'W'}</small></td><td class="tl">${r.cat}</td><td>${r.looks}</td><td style="color:var(--mut)">${r.possible}</td><td class="tl">${Object.entries(r.acts).map(([k,v])=>k+' '+v).join(', ')||'—'}</td><td class="tl" style="color:${lab[r.status][1]};font-weight:600">${lab[r.status][0]}</td></tr>`).join('')}</table></div></div>`;
 $('#panel').innerHTML=h;}

const b64u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pwKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function openWith(key){const b=window.__ENC;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(b.iv)},key,b64u(b.ct));D=JSON.parse(new TextDecoder().decode(pt));$('#gate').style.display='none';render();}
async function unlock(){const pw=$('#pw').value;try{const b=window.__ENC;
 if(b.v===2){/* the page is locked with a random key; the passphrase only unwraps that key, and only while b.wrap is still published */
  if(!b.wrap)throw new Error('no passphrase');const dk=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(b.wrap.iv)},await pwKey(pw,b64u(b.wrap.salt)),b64u(b.wrap.ct));
  await openWith(await crypto.subtle.importKey('raw',dk,{name:'AES-GCM'},false,['decrypt']));}
 else await openWith(await pwKey(pw,b64u(b.salt)));
 try{sessionStorage.setItem('alyth_pw',pw)}catch(e){}}catch(e){$('#err').textContent='Wrong passphrase.';}}
async function shopKey(){/* inside Shopify admin: Shopify hands the key to the signed-in staff member (the app's own private setting, read as that person). No passphrase. */
 const b=window.__ENC;if(!(b&&b.v===2&&window.shopify))return null;const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
 try{const r=await fetch('shopify:admin/api/graphql.json',{method:'POST',signal:ctl.signal,body:JSON.stringify({query:'{currentAppInstallation{metafield(namespace:"alyth_inv",key:"dash_key"){value}}}'})});const j=await r.json();
  const v=(((j||{}).data||{}).currentAppInstallation||{}).metafield;return v&&v.value?await crypto.subtle.importKey('raw',b64u(v.value),{name:'AES-GCM'},false,['decrypt']):null;}catch(e){return null;}finally{clearTimeout(t);}}
(async()=>{if(window.__DATA){D=window.__DATA;render();return;}if(!window.__ENC)return;const b=window.__ENC;
 try{const k=await shopKey();if(k){await openWith(k);return;}}catch(e){}
 $('#gate').style.display='flex';
 if(b.v===2&&!b.wrap){const g=$('#gate');g.querySelector('p').textContent='Open this page from the Alyth app inside Shopify admin. It opens on its own for signed-in staff.';$('#pw').style.display='none';g.querySelector('button').style.display='none';return;}
 try{const pw=sessionStorage.getItem('alyth_pw');if(pw){$('#pw').value=pw;await unlock();}}catch(e){}})();
</script>
