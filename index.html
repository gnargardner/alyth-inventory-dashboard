<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alyth Inventory</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#1a1a1a;--mut:#6b7177;--line:#e3e5e7;--acc:#1f6f5f;--red:#b42318;--amb:#b54708;--grn:#067647;--blu:#175cd3}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 4px}h1{font-size:18px;margin:0}small{color:var(--mut)}nav .tab{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;margin-left:6px;cursor:pointer;font:inherit;color:var(--mut)}nav .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}.kv b{color:var(--mut);font-weight:500}.opp{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;overflow:hidden}.opp .hd{display:grid;grid-template-columns:34px 1fr 130px 120px 110px 28px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}.opp .hd:hover{background:#fafbfb}.opp .rank{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}.opp .t{font-weight:600}.opp .sm{color:var(--mut);font-size:12.5px;margin-top:2px}.opp .amt{text-align:right;font-weight:600;font-size:16px;color:var(--grn)}.opp .amt small{display:block;color:var(--mut);font-weight:400;font-size:11px}.opp .eff{font-size:12px;color:var(--mut)}.dots{letter-spacing:2px;color:var(--acc)}.opp .st{font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;text-align:center;white-space:nowrap}.st.open{background:#e6f4ea;color:var(--grn)}.st.blocked{background:#fff1e0;color:var(--amb)}.st.in_progress{background:#e8f0fe;color:var(--blu)}.st.done{background:#eee;color:#666}.st.not_worth{background:#fde8e6;color:var(--red)}.opp .chev{color:var(--mut);transition:.2s}.opp.open .chev{transform:rotate(90deg)}.opp .body{display:none;padding:0 14px 14px 58px;font-size:13.5px;line-height:1.5}.opp.open .body{display:block}.opp .body h4{margin:12px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.opp .body ol{margin:4px 0;padding-left:18px}.opp .body a{color:var(--blu);font-size:12px}.sortbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--mut)}.sortbar button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}.sortbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:grid;gap:8px}.act{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.act:hover{border-color:var(--acc)}.act .p{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}.p1{background:var(--red)}.p2{background:var(--amb)}.p3{background:#888}.act .t{font-weight:600}.act .d{color:var(--mut);font-size:12.5px;margin-top:2px}.act input{margin-top:4px}.act.done .t{text-decoration:line-through;color:var(--mut)}
.months{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}.mo{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}.mo.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.mo .l{font-size:12px;color:var(--mut)}.mo .v{font-size:18px;font-weight:600}.mo .s{font-size:12px;color:var(--mut)}
details.explore{margin-top:14px}details.explore summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--mut)}
.warn{background:#fff7d6;border:1px solid #f0dc9a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}.card:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card.active{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.card .l{color:var(--mut);font-size:12px}.card .v{font-size:22px;font-weight:600;margin:4px 0 2px}.card .s{font-size:12px;color:var(--mut)}
.card.red .v{color:var(--red)}.card.amb .v{color:var(--amb)}.card.grn .v{color:var(--grn)}.card.blu .v{color:var(--blu)}
.panel{margin:8px 20px 24px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:15px;margin:0 0 6px}.panel p.d{color:var(--mut);margin:0 0 10px;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;min-width:220px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
tr.style{cursor:pointer}tr.style:hover{background:#fafbfb}tr.var td{color:#444;background:#fbfbfb}tr.var td:first-child{padding-left:26px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:#eee}.tag.DEAD{background:#fde8e6;color:var(--red)}.tag.OVER{background:#fff1e0;color:var(--amb)}.tag.OUT{background:#e8f0fe;color:var(--blu)}.tag.LOW{background:#fff7d6;color:#8a6d00}.tag.OK{background:#e6f4ea;color:var(--grn)}
.wrap{max-height:70vh;overflow:auto}.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}#gate div{background:#fff;padding:24px;border-radius:10px;border:1px solid var(--line);width:320px}#gate input{width:100%;padding:8px;margin:8px 0;border:1px solid var(--line);border-radius:6px}
.season{display:grid;grid-template-columns:120px repeat(12,1fr);gap:2px;font-size:12px}.season div{padding:4px;text-align:center;border-radius:3px}.season .n{text-align:left;color:var(--mut)}
</style></head><body>
<div id="gate" style="display:none"><div><b>Alyth Inventory</b><p style="color:#6b7177">Enter the dashboard passphrase.</p><input id="pw" type="password" placeholder="passphrase"><button onclick="unlock()">Open</button><p id="err" style="color:#b42318"></p></div></div>
<header><h1>Alyth inventory <small id="sub"></small></h1><nav><button class="tab active" onclick="mode('inv')">Inventory</button><button class="tab" onclick="mode('debt')">Debt &amp; financing</button><button class="tab" onclick="mode('sav')">Savings</button></nav><small id="gen"></small></header>
<div class="cards" id="cards"></div><div class="panel" id="panel"></div>
<script src="data.enc.js?v=1790173667"></script>
<script>
const $=s=>document.querySelector(s);const fmt$=x=>'$'+Math.round(x).toLocaleString();const fmtN=x=>Math.round(x).toLocaleString();
let D=null,view='overview',sortKey=null,sortDir=-1,q='',MODE='inv';
function mode(m){MODE=m;view=m==='debt'?'pay':m==='sav'?'sav':'overview';document.querySelectorAll('nav .tab').forEach((b,i)=>b.classList.toggle('active',['inv','debt','sav'][i]===m));render();}
let SSORT='money';
function renderSav(){const S=D.sav;const t=S.totals;
 $('#cards').innerHTML=[
  {cls:'grn',l:'Identified savings, open items',v:fmt$(t.open)+'/yr',s:fmt$(t.open/12)+' a month across '+t.count_open+' open items'},
  {cls:'blu',l:'Quick wins',v:fmt$(t.quick)+'/yr',s:t.count_quick+' items that take an hour or less'},
  {cls:'amb',l:'Waiting on the buyout closing',v:fmt$(t.blocked)+'/yr',s:'unlocks when Alysha is released from the U.S. Bank guaranties'},
  {cls:'',l:'Banked so far',v:fmt$(t.done)+'/yr',s:'items marked done'},
  {cls:'red',l:'If the whole stack were optimized',v:fmt$(S.stack_optimized.total)+'/yr',s:'card surcharge '+fmt$(S.stack_optimized.surcharge)+' + Wayflyer vs line/cards '+fmt$(S.stack_optimized.wayflyer)+' + card interest '+fmt$(S.stack_optimized.cards)}
 ].map(c=>`<div class="card ${c.cls}" style="cursor:default"><div class="l">${c.l}</div><div class="v">${c.v}</div><div class="s">${c.s}</div></div>`).join('');
 const items=[...S.items].sort((a,b)=>SSORT==='money'?(b.annual-a.annual)||(a.effort-b.effort):(a.effort-b.effort)||(b.annual-a.annual));
 let h=`<h2>Where to save money</h2><p class="d">Every dollar figure is recomputed from live balances, purchase levels and inventory on each run. Click a row for the detail, the steps, and the sources. Items are added as opportunities show up.</p>
 <div class="sortbar">Sort by <button class="${SSORT==='money'?'on':''}" onclick="SSORT='money';render()">most $ saved</button><button class="${SSORT==='ease'?'on':''}" onclick="SSORT='ease';render()">easiest first</button><span style="margin-left:auto">generated ${S.generated}</span></div>`;
 h+=items.map(r=>opp(r)).join('');
 if(S.rejected.length){h+='<h2 style="margin-top:18px">Looked at and not worth it</h2>'+S.rejected.map(r=>opp(r,true)).join('');}
 $('#panel').innerHTML=h;}
function cfTable(c){let h=`<h4>Replay of every draw, ${c.window[0]} to ${c.window[1]}</h4><div class="wrap" style="max-height:50vh"><table><tr><th>funded</th><th>advance</th><th>fee</th><th>fee %</th><th>days out</th><th>avg balance</th><th>annualized</th><th>same money on the line</th><th>on cards</th></tr>`;
 for(const d of c.draws){h+=`<tr><td>${d.funded}</td><td>${fmt$(d.advance)}</td><td>${fmt$(d.fee)}</td><td>${(d.fee_pct*100).toFixed(1)}%</td><td>${d.days_outstanding}</td><td>${fmt$(d.avg_balance)}</td><td>${d.annualized_on_avg?Math.round(d.annualized_on_avg*100)+'%':''}</td><td>${fmt$(d.line_cost_if_all_on_line)}</td><td>${fmt$(d.card_cost_if_all_on_cards)}</td></tr>`;}
 h+=`<tr><td><b>total</b></td><td></td><td><b>${fmt$(c.wayflyer_fees)}</b></td><td></td><td></td><td>avg ${fmt$(c.avg_outstanding)}</td><td></td><td colspan="2"><b>${fmt$(c.alt_realistic)}</b> with real limits (line to $50k, cards above); ${fmt$(c.alt_all_line)} if the line could carry it all</td></tr></table></div><p>Fees paid ${fmt$(c.wayflyer_fees)} over ${c.years} years vs ${fmt$(c.alt_realistic)} of interest on the alternative: ${fmt$(c.saving_realistic)} more, ${fmt$(c.saving_realistic_per_year)} a year. Peak outstanding ${fmt$(c.peak_outstanding)}, above the line's limit on ${c.days_over_line_limit} days, which is why the realistic figure uses cards for the excess.</p>`;return h;}
function opp(r,rej){const dots='●'.repeat(r.effort)+'○'.repeat(5-r.effort);const amt=rej?`<div class="amt" style="color:var(--red)">${fmt$(r.annual)}<small>net per year</small></div>`:`<div class="amt">${fmt$(r.annual)}<small>${fmt$(r.monthly)} / month</small></div>`;
 return `<div class="opp" id="opp_${r.id}"><div class="hd" onclick="this.parentElement.classList.toggle('open')"><div class="rank" style="${rej?'background:#bbb':''}">${rej?'–':r.rank}</div><div><div class="t">${r.title}</div><div class="sm">${r.summary}</div></div>${amt}<div class="eff"><span class="dots">${dots}</span><br>${r.effort_label}</div><div class="st ${r.status}">${r.status.replace('_',' ')}</div><div class="chev">›</div></div>
 <div class="body">${r.detail?r.detail.split('\n').filter(x=>x.trim()).map(x=>`<p>${x}</p>`).join(''):''}${r.blocked_until?`<div class="warn">Blocked until: ${r.blocked_until}</div>`:''}${r.steps?'<h4>Steps</h4><ol>'+r.steps.map(x=>`<li>${x}</li>`).join('')+'</ol>':''}${r.sources?'<h4>Sources</h4>'+r.sources.map(u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').split('/')[0]}</a>`).join(' · '):''}${r.id==='wayflyer_counterfactual'&&D.sav.counterfactual.draws?cfTable(D.sav.counterfactual):''}<h4>How the number is computed</h4><p><code style="font-size:12px;color:#555">${r.annual_formula||''}</code> <span class="sm">Added ${r.added}.</span></p></div></div>`;}
const DCARDS=[
 {k:'pay',cls:'grn',l:'How to pay for this PO',v:d=>fmt$(sum(d.fin.summary,'amount')),s:d=>'est. financing cost '+fmt$(sum(d.fin.summary,'est_cost')),d:'Which facility funds each part of the recommended PO, cheapest-first for how long the cash will be out, within the room each one has and the rules in the debt brief.'},
 {k:'stack',cls:'red',l:'Total debt',v:d=>fmt$(d.fin.stack.total_debt),s:d=>'~'+fmt$(d.fin.stack.annual_cost_at_balance)+'/yr cost at today\'s balances',d:'Every facility, its balance and the date it was read. Balances come from the lenders, never from Xero.'},
 {k:'avail',cls:'blu',l:'Credit available now',v:d=>fmt$(d.fin.stack.available_credit),s:d=>'after operating reserve on Chase; line counted as $0 until confirmed',d:'Room on each facility for inventory today.'},
 {k:'cal',cls:'amb',l:'Payments coming up',v:d=>{const n=d.fin.upcoming.filter(u=>daysTo(u.date)<=60).length;return n+' in 60 days'},s:d=>{const u=d.fin.upcoming.find(x=>/IN FULL/.test(x.what));return u?('Chase '+fmt$(u.amount)+' due '+u.date):''},d:'Scheduled payments and Wayflyer run-off dates. Chase autopay covers only the minimum, so the statement balance is a manual payment every month.'},
 {k:'wf',cls:'',l:'Wayflyer run-off',v:d=>fmt$(d.fin.stack.wayflyer_remaining),s:d=>'clears about '+d.fin.stack.wayflyer_clear,d:'Open draws repay oldest-first from 25% of daily sales. Fees are sunk; paying early saves nothing. No new draw while one is open.'},
 {k:'fee',cls:'red',l:'Card surcharge drag',v:d=>{const h=Object.values(d.fin.stack.card_fee_history);return fmt$(h[h.length-1]||0)+'/yr'},s:d=>(d.fin.stack.card_fee_pct*100).toFixed(2)+'% supplier fee on card-paid inventory (2025 level)',d:'Suppliers charge 2.99% on card payments and nearly all inventory has been card-paid. The fee is included in every card line of the pay-for-PO cost. Wire from the line carries no fee; Shopify Flex beats a card for bridges under ~45 days.'},
 {k:'save',cls:'grn',l:'Cheapest savings',v:d=>fmt$(d.fin.stack.usb_card_annual_cost)+'/yr',s:d=>'retire the U.S. Bank card balances ('+fmt$(d.fin.stack.usb_card_balances)+' at 15.49%)',d:'Payoff order for surplus cash from the brief: U.S. Bank card 9952, then 9708, then rebuild $20,000 of line availability, then hold cash. Never prepay the term loan or Wayflyer.'}
];
function daysTo(s){return Math.round((new Date(s)-new Date())/864e5)}
const CARDS=[
 {k:'cover',cls:'blu',l:'Months of cover',v:d=>d.kpi.months_cover+' mo',s:d=>fmt$(d.kpi.stock_cost)+' at cost vs '+fmt$(d.kpi.fc_cogs_12m/12)+'/mo',d:'All stock at cost divided by forecast monthly cost of goods. Target: 7 to 9 overall, lower on sellers.'},
 {k:'dead',cls:'red',l:'Dead stock',v:d=>fmt$(d.kpi.dead_cost),s:d=>fmtN(d.kpi.dead_units)+' units, over 24 months of cover or no sale in 6+ months',d:'Styles carrying stock the forecast says will not sell within two years, or that have not sold in six months. Candidates for markdown, bundles, or transfer. Not reordered.',filter:v=>v.status==='DEAD',col:'dead_cost'},
 {k:'over',cls:'amb',l:'Over-stock',v:d=>fmt$(d.kpi.over_cost),s:d=>fmtN(d.kpi.over_units)+' units, 12 to 24 months of cover',d:'More than a year of cover on hand. Still selling, so no action beyond not reordering; watch for drift into dead.',filter:v=>v.status==='OVER',col:'over_cost'},
 {k:'out',cls:'blu',l:'Stockouts on sellers',v:d=>d.kpi.out_variants+' sizes',s:d=>'about '+fmt$(d.kpi.lost_3m)+' retail at risk next 3 months',d:'Sizes with zero stock that the forecast expects to sell. Ranked by forecast sales at risk over the next three months.',filter:v=>v.status==='OUT',col:'lost_3m'},
 {k:'low',cls:'amb',l:'Running low',v:d=>d.kpi.low_variants+' sizes',s:d=>'less than one lead time of cover',d:'Sizes that will run out before a reorder placed today could land.',filter:v=>v.status==='LOW',col:'fc_next3m'},
 {k:'po',cls:'grn',l:'Recommended PO',v:d=>fmt$(d.kpi.po_cost),s:d=>fmtN(d.kpi.po_units)+' units, '+d.kpi.po_lines+' lines',d:'What to order now: lead time plus '+(D?D.config.cover_after_receipt_months:'')+' months of cover after receipt, plus safety stock, less what is on hand and on order. Custom designs rounded to MOQ.',filter:v=>v.suggest_qty>0,col:'suggest_cost'},
 {k:'inc',cls:'',l:'On order',v:d=>fmt$(d.kpi.incoming_cost),s:d=>fmtN(d.kpi.incoming_units)+' units on open POs incl. drafts',d:'Open purchase orders (ordered and draft) counted as incoming.',filter:v=>v.incoming>0,col:'incoming'},
 {k:'season',cls:'',l:'Seasonality',v:d=>'12-month curve',s:d=>'forecast by month',d:'Month-of-year demand index per category, 1.0 = average month, from full calendar years. Below: total forecast units by month.'}
];
function render(){$('#sub').textContent='· data through '+D.asof+', stock '+D.snapshot;$('#gen').textContent='generated '+D.generated;
 if(MODE==='debt'&&D.fin){return renderDebt();}
 if(MODE==='sav'&&D.sav){return renderSav();}
 $('#cards').innerHTML=CARDS.map(c=>`<div class="card ${c.cls} ${view===c.k?'active':''}" onclick="show('${c.k}')"><div class="l">${c.l}</div><div class="v">${c.v(D)}</div><div class="s">${c.s(D)}</div></div>`).join('');
 let h=actions('inv')+cashBlock()+scheduleBlock();
 const c=CARDS.find(x=>x.k===view)||CARDS[0];
 h+=`<details class="explore" ${EXPLORE||view!=='overview'?'open':''}><summary>Explore the data · ${c.l}</summary><h2 style="margin-top:8px">${c.l}</h2><p class="d">${c.d}</p>`;
 if(view==='season'){h+=season();}else{h+=table(c);}
 h+='</details>';
 $('#panel').innerHTML=h;}
let EXPLORE=false,SMONTH=0;
function actions(tab){const A=(D.actions||[]).filter(a=>a.tab===tab);if(!A.length)return '';let done={};try{done=JSON.parse(localStorage.getItem('alyth_done')||'{}')}catch(e){}
 return `<h2>Do this now</h2><p class="d">Generated from today's data, most urgent first. Tick what is handled; the tick is remembered on this device only. Click a row to open the numbers behind it.</p><div class="acts">`+A.map((a,i)=>{const k=tab+':'+a.title;return `<div class="act ${done[k]?'done':''}" onclick="if(event.target.tagName!=='INPUT'){EXPLORE=true;show('${a.link}')}"><div class="p p${a.p}">${a.p}</div><div><div class="t">${a.title}</div><div class="d">${a.detail}</div></div><input type="checkbox" ${done[k]?'checked':''} onclick="event.stopPropagation();toggleDone('${k.replace(/'/g,"\\'")}')"></div>`}).join('')+'</div>';}
function toggleDone(k){let d={};try{d=JSON.parse(localStorage.getItem('alyth_done')||'{}')}catch(e){}d[k]=!d[k];try{localStorage.setItem('alyth_done',JSON.stringify(d))}catch(e){}render();}
function scheduleBlock(){const S=D.schedule;if(!S||!S.labels)return '';const mt=S.month_totals;const lab=S.labels[SMONTH];
 let h=`<h2 style="margin-top:18px">What to buy, next 4 months</h2><p class="d">Month 0 is the PO to place today. Later months are when each style-color will run below safety stock after lead time, so the order must go in that month to land in time. Quantities recompute daily; the further out, the more they will move.</p><div class="months">`;
 h+=S.labels.map((l,i)=>{const t=mt.find(x=>x.month_label===l)||{cost:0,qty:0,lines:0};return `<div class="mo ${SMONTH===i?'on':''}" onclick="SMONTH=${i};render()"><div class="l">${i===0?'Place now · ':''}${monthName(l)}</div><div class="v">${fmt$(t.cost)}</div><div class="s">${fmtN(t.qty)} units · ${t.lines} style-colors</div></div>`}).join('')+'</div>';
 const rows=S.grid.filter(g=>g.order_month===SMONTH).sort((a,b)=>b.cost-a.cost);
 if(SMONTH===0&&D.fin&&D.fin.summary.length){h+=`<div class="warn"><b>Pay for it with:</b> `+D.fin.summary.map(r=>`${r.name.replace(' (Alyth Active LLC)','')} ${fmt$(r.amount)}`).join(' · ')+` · est. financing cost ${fmt$(sum(D.fin.summary,'est_cost'))}. Best order date ${D.fin.buy_date} (Chase float ${D.fin.float_days} days); order the sold-out lines today. Full breakdown on the Debt tab.</div>`;}
 if(SMONTH>0){h+=`<p class="d">Financing for this month is decided when it is placed; today's rule of thumb: line by wire if confirmed, otherwise Chase float for the fastest sellers and card 9708 for the rest.</p>`;}
 if(!rows.length){h+='<p class="d">Nothing needs ordering this month on current forecasts.</p>';return h;}
 h+=`<div class="wrap" style="max-height:55vh"><table><tr><th>style</th><th>color</th><th>type</th><th>sizes</th><th>units</th><th>cost</th><th>debt line</th><th>MOQ note</th></tr>`;
 for(const g of rows){const sizes=S.lines.filter(l=>l.order_month===SMONTH&&l.product_title===g.product_title&&l.color===g.color&&l.extra===g.extra).sort((a,b)=>a.size.localeCompare(b.size));
  h+=`<tr class="style" onclick="tog(this)"><td>${g.product_title}${g.continuing==='yes'?'':' <span class="tag">not on list</span>'}</td><td>${g.color}${g.extra?' '+g.extra:''}</td><td>${g.design_type||''}</td><td>${g.sizes}</td><td>${fmtN(g.qty)}</td><td>${fmt$(g.cost)}</td><td style="text-align:left"><small>${SMONTH===0?payFor(g):'decided when placed'}</small></td><td><small style="color:#8a6d00">${g.moq_flag||''}</small></td></tr>`;
