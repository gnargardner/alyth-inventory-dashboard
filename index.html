<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alyth Inventory</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#1a1a1a;--mut:#6b7177;--line:#e3e5e7;--acc:#1f6f5f;--red:#b42318;--amb:#b54708;--grn:#067647;--blu:#175cd3}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 4px}h1{font-size:18px;margin:0}small{color:var(--mut)}nav .tab{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;margin-left:6px;cursor:pointer;font:inherit;color:var(--mut)}nav .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}.kv b{color:var(--mut);font-weight:500}.warn{background:#fff7d6;border:1px solid #f0dc9a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}.card:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card.active{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.card .l{color:var(--mut);font-size:12px}.card .v{font-size:22px;font-weight:600;margin:4px 0 2px}.card .s{font-size:12px;color:var(--mut)}
.card.red .v{color:var(--red)}.card.amb .v{color:var(--amb)}.card.grn .v{color:var(--grn)}.card.blu .v{color:var(--blu)}
.panel{margin:8px 20px 24px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:15px;margin:0 0 6px}.panel p.d{color:var(--mut);margin:0 0 10px;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;min-width:220px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
tr.style{cursor:pointer}tr.style:hover{background:#fafbfb}tr.var td{color:#444;background:#fbfbfb}tr.var td:first-child{padding-left:26px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:#eee}.tag.DEAD{background:#fde8e6;color:var(--red)}.tag.OVER{background:#fff1e0;color:var(--amb)}.tag.OUT{background:#e8f0fe;color:var(--blu)}.tag.LOW{background:#fff7d6;color:#8a6d00}.tag.OK{background:#e6f4ea;color:var(--grn)}
.wrap{max-height:70vh;overflow:auto}.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}#gate div{background:#fff;padding:24px;border-radius:10px;border:1px solid var(--line);width:320px}#gate input{width:100%;padding:8px;margin:8px 0;border:1px solid var(--line);border-radius:6px}
.season{display:grid;grid-template-columns:120px repeat(12,1fr);gap:2px;font-size:12px}.season div{padding:4px;text-align:center;border-radius:3px}.season .n{text-align:left;color:var(--mut)}
</style></head><body>
<div id="gate" style="display:none"><div><b>Alyth Inventory</b><p style="color:#6b7177">Enter the dashboard passphrase.</p><input id="pw" type="password" placeholder="passphrase"><button onclick="unlock()">Open</button><p id="err" style="color:#b42318"></p></div></div>
<header><h1>Alyth inventory <small id="sub"></small></h1><nav><button class="tab active" onclick="mode('inv')">Inventory</button><button class="tab" onclick="mode('debt')">Debt &amp; financing</button></nav><small id="gen"></small></header>
<div class="cards" id="cards"></div><div class="panel" id="panel"></div>
<script src="data.enc.js?v=1790095043"></script>
<script>
const $=s=>document.querySelector(s);const fmt$=x=>'$'+Math.round(x).toLocaleString();const fmtN=x=>Math.round(x).toLocaleString();
let D=null,view='overview',sortKey=null,sortDir=-1,q='',MODE='inv';
function mode(m){MODE=m;view=m==='debt'?'pay':'overview';document.querySelectorAll('nav .tab').forEach((b,i)=>b.classList.toggle('active',(i===0)===(m==='inv')));render();}
const DCARDS=[
 {k:'pay',cls:'grn',l:'How to pay for this PO',v:d=>fmt$(sum(d.fin.summary,'amount')),s:d=>'est. financing cost '+fmt$(sum(d.fin.summary,'est_cost')),d:'Which facility funds each part of the recommended PO, cheapest-first for how long the cash will be out, within the room each one has and the rules in the debt brief.'},
 {k:'stack',cls:'red',l:'Total debt',v:d=>fmt$(d.fin.stack.total_debt),s:d=>'~'+fmt$(d.fin.stack.annual_cost_at_balance)+'/yr cost at today\'s balances',d:'Every facility, its balance and the date it was read. Balances come from the lenders, never from Xero.'},
 {k:'avail',cls:'blu',l:'Credit available now',v:d=>fmt$(d.fin.stack.available_credit),s:d=>'after operating reserve on Chase; line counted as $0 until confirmed',d:'Room on each facility for inventory today.'},
 {k:'cal',cls:'amb',l:'Payments coming up',v:d=>{const n=d.fin.upcoming.filter(u=>daysTo(u.date)<=60).length;return n+' in 60 days'},s:d=>{const u=d.fin.upcoming.find(x=>/IN FULL/.test(x.what));return u?('Chase '+fmt$(u.amount)+' due '+u.date):''},d:'Scheduled payments and Wayflyer run-off dates. Chase autopay covers only the minimum, so the statement balance is a manual payment every month.'},
 {k:'wf',cls:'',l:'Wayflyer run-off',v:d=>fmt$(d.fin.stack.wayflyer_remaining),s:d=>'clears about '+d.fin.stack.wayflyer_clear,d:'Open draws repay oldest-first from 25% of daily sales. Fees are sunk; paying early saves nothing. No new draw while one is open.'},
 {k:'save',cls:'grn',l:'Cheapest savings',v:d=>fmt$(d.fin.stack.usb_card_annual_cost)+'/yr',s:d=>'retire the U.S. Bank card balances ('+fmt$(d.fin.stack.usb_card_balances)+' at 15.49%)',d:'Payoff order for surplus cash from the brief: U.S. Bank card 9952, then 9708, then rebuild $20,000 of line availability, then hold cash. Never prepay the term loan or Wayflyer.'}
];
function daysTo(s){return Math.round((new Date(s)-new Date())/864e5)}
const CARDS=[
 {k:'cover',cls:'blu',l:'Months of cover',v:d=>d.kpi.months_cover+' mo',s:d=>fmt$(d.kpi.stock_cost)+' at cost vs '+fmt$(d.kpi.fc_cogs_12m/12)+'/mo',d:'All stock at cost divided by forecast monthly cost of goods. Target: 7 to 9 overall, lower on sellers.'},
 {k:'dead',cls:'red',l:'Dead stock',v:d=>fmt$(d.kpi.dead_cost),s:d=>fmtN(d.kpi.dead_units)+' units, over 24 months of cover or no sale in 6+ months',d:'Styles carrying stock the forecast says will not sell within two years, or that have not sold in six months. Candidates for markdown, bundles, or transfer. Not reordered.',filter:v=>v.status==='DEAD',col:'dead_cost'},
 {k:'over',cls:'amb',l:'Over-stock',v:d=>fmt$(d.kpi.over_cost),s:d=>fmtN(d.kpi.over_units)+' units, 12 to 24 months of cover',d:'More than a year of cover on hand. Still selling, so no action beyond not reordering; watch for drift into dead.',filter:v=>v.status==='OVER',col:'over_cost'},
 {k:'out',cls:'blu',l:'Stockouts on sellers',v:d=>d.kpi.out_variants+' sizes',s:d=>'about '+fmt$(d.kpi.lost_3m)+' retail at risk next 3 months',d:'Sizes with zero stock that the forecast expects to sell. Ranked by forecast sales at risk over the next three months.',filter:v=>v.status==='OUT',col:'lost_3m'},
 {k:'low',cls:'amb',l:'Running low',v:d=>d.kpi.low_variants+' sizes',s:d=>'less than one lead time of cover',d:'Sizes that will run out before a reorder placed today could land.',filter:v=>v.status==='LOW',col:'fc_next3m'},
 {k:'po',cls:'grn',l:'Recommended PO',v:d=>fmt$(d.kpi.po_cost),s:d=>fmtN(d.kpi.po_units)+' units, '+d.kpi.po_lines+' lines',d:'What to order now: lead time plus '+(D?D.config.cover_after_receipt_months:'')+' months of cover after receipt, plus safety stock, less what is on hand and on order. Custom designs rounded to MOQ.',filter:v=>v.suggest_qty>0,col:'suggest_cost'},
 {k:'inc',cls:'',l:'On order',v:d=>fmt$(d.kpi.incoming_cost),s:d=>fmtN(d.kpi.incoming_units)+' units on open POs incl. drafts',d:'Open purchase orders (ordered and draft) counted as incoming.',filter:v=>v.incoming>0,col:'incoming'},
 {k:'season',cls:'',l:'Seasonality',v:d=>'12-month curve',s:d=>'forecast by month',d:'Month-of-year demand index per category, 1.0 = average month, from full calendar years. Below: total forecast units by month.'}
];
function render(){$('#sub').textContent='· data through '+D.asof+', stock '+D.snapshot;$('#gen').textContent='generated '+D.generated;
 if(MODE==='debt'&&D.fin){return renderDebt();}
 $('#cards').innerHTML=CARDS.map(c=>`<div class="card ${c.cls} ${view===c.k?'active':''}" onclick="show('${c.k}')"><div class="l">${c.l}</div><div class="v">${c.v(D)}</div><div class="s">${c.s(D)}</div></div>`).join('');
 const c=CARDS.find(x=>x.k===view)||CARDS[0];let h=`<h2>${c.l}</h2><p class="d">${c.d}</p>`;
 if(view==='season'){h+=season();}else{h+=table(c);}
 $('#panel').innerHTML=h;}
function show(k){view=k;sortKey=null;q='';render();}
function renderDebt(){const f=D.fin;$('#cards').innerHTML=DCARDS.map(c=>`<div class="card ${c.cls} ${view===c.k?'active':''}" onclick="show('${c.k}')"><div class="l">${c.l}</div><div class="v">${c.v(D)}</div><div class="s">${c.s(D)}</div></div>`).join('');
 const c=DCARDS.find(x=>x.k===view)||DCARDS[0];let h=`<h2>${c.l}</h2><p class="d">${c.d}</p>`;
 if(view==='pay'){h+=`<div class="warn">Best purchase date <b>${f.buy_date}</b> (day after the Chase statement closes): ${f.float_days} days of free float. That statement closes ${f.float_close} and must be paid in full on <b>${f.float_due}</b>. Buying today gives ${f.today_float_days} days (due ${f.today_due}); order the OUT lines now, the lost sales cost more than the extra float.</div>`;
  h+='<table><tr><th>pay with</th><th>amount</th><th>lines</th><th>est. cost</th><th>room before</th><th>room after</th></tr>'+f.summary.map(r=>`<tr><td>${r.name}</td><td>${fmt$(r.amount)}</td><td>${r.lines}</td><td>${fmt$(r.est_cost)}</td><td>${fmt$(r.available_before)}</td><td>${fmt$(r.available_after)}</td></tr>`).join('')+`<tr><td><b>total</b></td><td><b>${fmt$(sum(f.summary,'amount'))}</b></td><td></td><td><b>${fmt$(sum(f.summary,'est_cost'))}</b></td><td></td><td></td></tr></table>`;
  for(const r of f.summary){const g={};for(const a of f.assign.filter(a=>a.facility===r.facility)){g[a.product_title]=(g[a.product_title]||0)+a.amount;}const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);
   h+=`<h2 style="margin-top:14px">${r.name} · ${fmt$(r.amount)}</h2><div class="wrap" style="max-height:40vh"><table><tr><th>style</th><th>amount</th><th>cash back in</th><th>runs out in</th></tr>`+rows.map(([t,a])=>{const x=f.assign.filter(z=>z.facility===r.facility&&z.product_title===t);const rd=Math.max(...x.map(z=>z.recover_days)),ro=Math.min(...x.map(z=>z.runout_months));return `<tr><td>${t}${x[0].continuing==='yes'?'':' <span class="tag">not on list</span>'}</td><td>${fmt$(a)}</td><td>${rd} d</td><td>${ro} mo</td></tr>`}).join('')+'</table></div>';}
  h+=f.notes.map(n=>`<p class="d">${n}</p>`).join('');}
 else if(view==='stack'){h+='<div class="wrap"><table><tr><th>facility</th><th>balance</th><th>as of</th><th>limit</th><th>available</th><th>rate</th><th>cost/yr</th><th>next payment</th><th>guaranty</th></tr>'+f.facilities.map(r=>`<tr><td title="${r.note}">${r.name}</td><td>${fmt$(r.balance)}</td><td>${r.balance_as_of}</td><td>${r.limit?fmt$(r.limit):''}</td><td>${r.available_txt}</td><td>${r.rate_txt}</td><td>${fmt$(r.annual_cost_at_balance)}</td><td>${r.payment?fmt$(r.payment):''}${r.payment_day?' on the '+r.payment_day+'th':''}</td><td>${r.guaranty}</td></tr>`).join('')+`<tr><td><b>total</b></td><td><b>${fmt$(f.stack.total_debt)}</b></td><td></td><td></td><td><b>${fmt$(f.stack.available_credit)}</b></td><td>${(f.stack.weighted_apr_ex_mca*100).toFixed(1)}% avg (ex-Wayflyer)</td><td><b>${fmt$(f.stack.annual_cost_at_balance)}</b></td><td></td><td></td></tr></table></div>`;
  h+='<h2 style="margin-top:14px">Notes per facility</h2><div class="kv">'+f.facilities.map(r=>`<b>${r.name}</b><span>${r.note}</span>`).join('')+'</div>';
  h+=`<p class="d" style="margin-top:10px">Post-closing debt cap from the buyout plan: ${fmt$(f.stack.post_closing_debt_cap)}. Cash floor (one month of fixed outflows): ${fmt$(f.stack.cash_floor_known)} known${f.stack.cash_floor_missing.length?', plus '+f.stack.cash_floor_missing.join(', ')+' not yet provided':''}.</p>`;}
 else if(view==='avail'){h+='<table><tr><th>facility</th><th>available</th><th>rate</th><th>use it for</th></tr>'+f.facilities.filter(r=>r.type!=='term_loan').map(r=>`<tr><td>${r.name}</td><td>${r.available_txt}</td><td>${r.rate_txt}</td><td>${r.note}</td></tr>`).join('')+'</table>';}
 else if(view==='cal'){h+='<table><tr><th>date</th><th>in</th><th>facility</th><th>amount</th><th>what</th></tr>'+f.upcoming.map(u=>`<tr ${/IN FULL/.test(u.what)?'style="background:#fff7d6"':''}><td>${u.date}</td><td>${daysTo(u.date)} d</td><td>${u.facility}</td><td>${fmt$(u.amount)}</td><td>${u.what}</td></tr>`).join('')+'</table>';}
 else if(view==='wf'){const w=f.wayflyer;h+='<table><tr><th>draw funded</th><th>advance</th><th>fee</th><th>fee %</th><th>total to remit</th><th>est. paid off</th></tr>'+w.open_draws.map(d=>`<tr><td>${d.funded}</td><td>${fmt$(d.advance)}</td><td>${fmt$(d.fee)}</td><td>${(d.fee_pct*100).toFixed(2)}%</td><td>${fmt$(d.advance+d.fee)}</td><td>${d.est_payoff}</td></tr>`).join('')+`</table><p class="d">Remaining obligation ${fmt$(w.balance)} (dashboard ${w.balance_as_of}). Remittance ${(w.remittance_rate*100)}% of gross Shopify sales, daily, oldest draw first. ${w.note}</p>`;}
 else if(view==='save'){const o=f.rules.payoff_order;h+='<ol>'+o.map(x=>`<li>${x.replace(/_/g,' ')}</li>`).join('')+'</ol><p class="d">Never prepay: '+f.rules.never_prepay.join(', ')+'. New Wayflyer draw only if: one open draw at most, fee ≤ 5%, sell-through ≤ 120 days, not funded in Oct/Nov, cash floor covered.</p>';}
 $('#panel').innerHTML=h;}
function season(){const S=D.seasonality;const M='JFMAMJJASOND'.split('');let h='<div class="season"><div class="n"></div>'+M.map(m=>`<div class="n">${m}</div>`).join('');
 for(const [k,v] of Object.entries(S)){h+=`<div class="n">${k==='_store'?'store (all)':k}</div>`+v.map(x=>`<div style="background:rgba(31,111,95,${Math.min(1,Math.max(0,(x-0.4)/1.6))*0.8+0.05});color:${x>1.2?'#fff':'#222'}">${x.toFixed(2)}</div>`).join('');}
 h+='</div><h2 style="margin-top:16px">Forecast units by month</h2><table><tr><th>month</th><th>units</th><th></th></tr>';const mx=Math.max(...Object.values(D.forecast_months));
 for(const [m,u] of Object.entries(D.forecast_months)){h+=`<tr><td>${m}</td><td>${fmtN(u)}</td><td style="width:50%"><div class="bar"><i style="width:${u/mx*100}%"></i></div></td></tr>`;}return h+'</table>';}
function table(c){const f=c.filter||(v=>true);const vs=D.variants.filter(f);const byStyle={};for(const v of vs){(byStyle[v.product_title]=byStyle[v.product_title]||[]).push(v);}
 let rows=Object.entries(byStyle).map(([t,arr])=>({t,cont:arr[0].continuing==='yes',dt:arr[0].design_type,cat:arr[0].cat,n:arr.length,on_hand:sum(arr,'on_hand'),cost:sum(arr,'stock_cost'),fc12:sum(arr,'fc_12m'),cover:cov(sum(arr,'on_hand'),sum(arr,'fc_12m')),sug:sum(arr,'suggest_qty'),sugc:sum(arr,'suggest_cost'),lost:sum(arr,'lost_3m'),inc:sum(arr,'incoming'),last:arr.map(v=>v.last_sale).sort().pop(),arr}));
 if(q){const qq=q.toLowerCase();rows=rows.filter(r=>r.t.toLowerCase().includes(qq)||r.arr.some(v=>(v.sku||'').toLowerCase().includes(qq)||(v.variant_title||'').toLowerCase().includes(qq)));}
 const defKey={dead:'cost',over:'cost',out:'lost',low:'fc12',po:'sugc',inc:'inc',cover:'cost'}[view]||'cost';const key=sortKey||defKey;rows.sort((a,b)=>(a[key]>b[key]?1:a[key]<b[key]?-1:0)*sortDir);
 const cols=[['t','style'],['cat','cat'],['n','sizes'],['on_hand','on hand'],['inc','on order'],['cost','stock $'],['fc12','fc 12m'],['cover','cover mo'],['sug','buy qty'],['sugc','buy $'],['lost','at risk $'],['last','last sale']];
 let h=`<div class="tools"><input type="search" placeholder="search style, sku, color, size" value="${q}" oninput="q=this.value;render();"><small style="align-self:center">${rows.length} styles · ${vs.length} sizes · click a style to open sizes · click a header to sort</small></div><div class="wrap"><table><tr>${cols.map(([k,l])=>`<th onclick="srt('${k}')">${l}${key===k?(sortDir<0?' ▼':' ▲'):''}</th>`).join('')}</tr>`;
 for(const r of rows){h+=`<tr class="style" onclick="tog(this)"><td>${r.t} ${r.cont?`<span class="tag OK" title="on the continuing list">${r.dt}</span>`:'<span class="tag" title="not on the continuing list: seasonal add-on or dropped">not on list</span>'}</td><td>${r.cat}</td><td>${r.n}</td><td>${fmtN(r.on_hand)}</td><td>${fmtN(r.inc)}</td><td>${fmt$(r.cost)}</td><td>${fmtN(r.fc12)}</td><td>${r.cover}</td><td>${fmtN(r.sug)}</td><td>${fmt$(r.sugc)}</td><td>${fmt$(r.lost)}</td><td>${r.last||''}</td></tr>`;
  for(const v of r.arr.sort((a,b)=>(a.color+a.extra+a.size).localeCompare(b.color+b.extra+b.size))){h+=`<tr class="var" style="display:none"><td>${v.color}${v.extra?' '+v.extra:''} / ${v.size} <small style="color:#999">${v.sku||''}</small> <span class="tag ${v.status}">${v.status}</span>${v.moq_action?` <small style="color:#8a6d00">${v.moq_action}</small>`:''}</td><td></td><td></td><td>${fmtN(v.on_hand)}</td><td>${fmtN(v.incoming)}</td><td>${fmt$(v.stock_cost)}</td><td>${v.fc_12m.toFixed(0)}</td><td>${v.months_cover>=999?'∞':v.months_cover}</td><td>${v.suggest_qty}</td><td>${fmt$(v.suggest_cost)}</td><td>${fmt$(v.lost_3m)}</td><td>${v.last_sale||''}</td></tr>`;}}
 return h+'</table></div>';}
function sum(a,k){return a.reduce((s,v)=>s+(+v[k]||0),0)}function cov(oh,fc){return fc>0?(oh/(fc/12)).toFixed(1):(oh>0?'∞':'0')}
function srt(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=-1;}render();}
function tog(tr){let n=tr.nextElementSibling;while(n&&n.classList.contains('var')){n.style.display=n.style.display==='none'?'':'none';n=n.nextElementSibling;}}
async function unlock(){const pw=$('#pw').value;try{const b=window.__ENC;const dec=new TextDecoder();const salt=Uint8Array.from(atob(b.salt),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob(b.iv),c=>c.charCodeAt(0)),ct=Uint8Array.from(atob(b.ct),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);D=JSON.parse(dec.decode(pt));try{sessionStorage.setItem('alyth_pw',pw)}catch(e){}$('#gate').style.display='none';render();}catch(e){$('#err').textContent='Wrong passphrase.';}}
(async()=>{if(window.__DATA){D=window.__DATA;render();}else if(window.__ENC){$('#gate').style.display='flex';try{const pw=sessionStorage.getItem('alyth_pw');if(pw){$('#pw').value=pw;await unlock();}}catch(e){}}})();
</script>
</body></html>
